name: Security CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
      - run: npm ci
      - run: npm run ci:quality
      - run: npm test
      - run: npm run api:openapi:export
      - name: Refuser une spécification OpenAPI non synchronisée
        run: git diff --exit-code -- docs/openapi-v1.json
      - name: Audit npm (élevé/critique)
        run: npm audit --audit-level=high
      - name: Build de production
        run: npm run build
        env:
          DATABASE_URL: postgresql://runtime:ci-only@localhost:5432/toutci
          JWT_SECRET: CI-only-secret-with-upper-lower-number-symbol-1234!
          JWT_COOKIE_NAME: restauci_session
          UPSTASH_REDIS_REST_URL: https://ci.invalid
          UPSTASH_REDIS_REST_TOKEN: ci-only-token
          CRON_SECRET: CI-only-cron-secret-with-32-characters-minimum!
          NEXT_PUBLIC_APP_URL: https://ci.example.invalid
          NEXT_PUBLIC_APP_NAME: Toutci
          NODE_ENV: production

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vulnérabilités, secrets et mauvaises configurations
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
